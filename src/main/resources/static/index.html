<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>词忆 · Word Memory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div id="app">
    <div id="toast-container"></div>

    <!-- 登录页 -->
    <div id="view-auth" class="view hidden">
      <div class="auth-shell">
        <div class="auth-brand">
          <div class="logo-mark">词</div>
          <h1>词忆</h1>
          <p>艾宾浩斯记忆 · 科学背单词</p>
        </div>
        <div class="auth-card card">
          <div class="tabs">
            <button class="tab active" data-tab="login">登录</button>
            <button class="tab" data-tab="register">注册</button>
          </div>
          <form id="form-login" class="auth-form">
            <label>用户名<input type="text" name="username" placeholder="请输入用户名" required></label>
            <label>密码<input type="password" name="password" placeholder="请输入密码" required></label>
            <button type="submit" class="btn btn-primary btn-block">登录</button>
          </form>
          <form id="form-register" class="auth-form hidden">
            <label>用户名<input type="text" name="username" placeholder="3-50 个字符" required minlength="3"></label>
            <label>昵称<input type="text" name="nickname" placeholder="可选"></label>
            <label>密码<input type="password" name="password" placeholder="至少 6 位" required minlength="6"></label>
            <button type="submit" class="btn btn-primary btn-block">注册</button>
          </form>
          <p class="auth-hint">演示账号：<strong>demo</strong> / <strong>password123</strong></p>
        </div>
      </div>
    </div>

    <!-- 主布局 -->
    <div id="view-main" class="view hidden">
      <header class="topbar">
        <div class="topbar-left">
          <span class="logo-mark sm">词</span>
          <span class="brand-name">词忆</span>
        </div>
        <nav class="nav" id="main-nav">
          <a href="#/home" data-route="home">首页</a>
          <a href="#/books" data-route="books">单词书</a>
          <a href="#/memorize" data-route="memorize">背单词</a>
          <a href="#/quiz" data-route="quiz">自测</a>
          <a href="#/wrong" data-route="wrong">错词</a>
          <a href="#/exams" data-route="exams">记录</a>
        </nav>
        <div class="topbar-right">
          <span id="user-name" class="user-badge"></span>
          <button id="btn-logout" class="btn btn-ghost btn-sm">退出</button>
        </div>
      </header>

      <main class="main-content">
        <!-- 首页 -->
        <section id="page-home" class="page hidden">
          <div class="page-header">
            <h2>欢迎回来</h2>
            <p>选择单词书，开始今天的学习吧</p>
          </div>
          <div class="book-select-row card">
            <label>当前单词书
              <select id="global-book-select" class="select"></select>
            </label>
          </div>
          <div class="stats-grid" id="home-stats"></div>
          <div class="action-grid">
            <a href="#/memorize" class="action-card card">
              <span class="action-icon">📖</span>
              <h3>开始背单词</h3>
              <p>艾宾浩斯间隔复习</p>
            </a>
            <a href="#/quiz" class="action-card card">
              <span class="action-icon">✏️</span>
              <h3>单词自测</h3>
              <p>四选一快速检验</p>
            </a>
            <a href="#/wrong" class="action-card card">
              <span class="action-icon">📊</span>
              <h3>错词分析</h3>
              <p>查看薄弱词汇</p>
            </a>
            <a href="#/exams" class="action-card card">
              <span class="action-icon">📝</span>
              <h3>考试记录</h3>
              <p>回顾历史成绩</p>
            </a>
          </div>
        </section>

        <!-- 单词书 -->
        <section id="page-books" class="page hidden">
          <div class="page-header row">
            <div>
              <h2>单词书管理</h2>
              <p>创建和管理你的词汇本</p>
            </div>
            <button id="btn-new-book" class="btn btn-primary">+ 新建单词书</button>
          </div>
          <div id="book-list" class="book-grid"></div>
          <div id="book-detail" class="hidden">
            <div class="page-header row">
              <div>
                <button id="btn-back-books" class="btn btn-ghost btn-sm">← 返回列表</button>
                <h2 id="detail-book-name"></h2>
                <p id="detail-book-desc"></p>
              </div>
              <button id="btn-import-words" class="btn btn-ghost">批量导入</button>
              <button id="btn-add-word" class="btn btn-primary">+ 添加单词</button>
            </div>
            <div id="word-list" class="word-table-wrap card"></div>
          </div>
        </section>

        <!-- 背单词 -->
        <section id="page-memorize" class="page hidden">
          <div class="page-header row">
            <div>
              <h2>背单词</h2>
              <p id="memorize-progress-text">加载中…</p>
            </div>
            <select id="memorize-book-select" class="select"></select>
          </div>
          <div id="ebbinghaus-panel" class="card ebbinghaus-panel"></div>
          <div id="memorize-card" class="flashcard card"></div>
          <div id="memorize-empty" class="empty-state card hidden">
            <p>🎉 今日复习已完成，或该单词书暂无单词</p>
            <a href="#/books" class="btn btn-primary">去添加单词</a>
          </div>
        </section>

        <!-- 自测 -->
        <section id="page-quiz" class="page hidden">
          <div id="quiz-setup">
            <div class="page-header row">
              <div>
                <h2>单词自测</h2>
                <p>四选一，检验掌握程度</p>
              </div>
              <select id="quiz-book-select" class="select"></select>
            </div>
            <div class="card quiz-setup-card">
              <label>题目数量
                <input type="number" id="quiz-count" class="input" value="10" min="1" max="50">
              </label>
              <button id="btn-start-quiz" class="btn btn-primary btn-lg">开始测验</button>
            </div>
          </div>
          <div id="quiz-active" class="hidden">
            <div class="quiz-header">
              <span id="quiz-progress-label">1 / 10</span>
              <div class="progress-bar"><div id="quiz-progress-bar" class="progress-fill"></div></div>
            </div>
            <div id="quiz-question" class="quiz-card card"></div>
          </div>
          <div id="quiz-result" class="hidden">
            <div class="result-card card">
              <div class="result-score" id="result-score">0</div>
              <p id="result-detail"></p>
              <button id="btn-quiz-retry" class="btn btn-primary">再来一次</button>
              <a href="#/exams" class="btn btn-ghost">查看记录</a>
            </div>
          </div>
        </section>

        <!-- 错词 -->
        <section id="page-wrong" class="page hidden">
          <div class="page-header row">
            <div>
              <h2>错词统计</h2>
              <p>重点关注这些薄弱词汇</p>
            </div>
            <select id="wrong-book-select" class="select">
              <option value="">全部单词书</option>
            </select>
          </div>
          <div id="wrong-stats" class="stats-grid"></div>
          <div id="wrong-list" class="word-table-wrap card"></div>
        </section>

        <!-- 考试记录 -->
        <section id="page-exams" class="page hidden">
          <div class="page-header">
            <h2>考试记录</h2>
            <p>查看历史自测成绩</p>
          </div>
          <div id="exam-list" class="exam-list"></div>
        </section>
      </main>
    </div>
  </div>

  <!-- 通用弹窗 -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal card" id="modal-content"></div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
